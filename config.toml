# Config for training and running the model

[training]
batch_size = 4
random_seed = 42
training_steps = 150_000
image_buffer_size = 100
style_mixing_prob = 0.9 # Probability to use two different style vectors in the decoder
deterministic_cuda_kernels = false # Exact results between different GPUs, but 4x slower
gpu_number = 0
checkpoint_directory = "checkpoints"
training_run = "run_name"

[inference]
checkpoint = "/home/struan/one-to-many-gan/checkpoints/bkp/no_ada/models/150000.tar"
batch_size = 12

[generation]
flooring_dir = "/flooring"

[optimisation]
style_cycle_loss_lambda = 5.0
identity_loss_lambda = 5.0
reconstruction_loss_lambda = 5.0
kl_loss_lambda = 0.01
path_loss_lambda = 0.1
path_loss_jacobian_granularity = [0.1, 0.2] # Min and max for sampling h to approximite Jacobian for path length
learning_rate = 2e-3
mapping_network_learning_rate = 2e-5 # 100x less
adam_betas = [0.5, 0.99]

[evaluation]
log_interval = 500
checkpoint_interval = 5_000
cond_is_n_evaluation_images = 100 # Number of images generated for conditional inception score
n_evaluation_images = 10_000

[architecture]
w_dim = 6 # Dimensionality of the style vector
add_latent_noise = false # Add noise to latent feature maps
min_latent_resolution = 64
n_resnet_blocks = 7
mapping_network_layers = 2

[data]
image_size = [512, 256]
image_channels = 1
shoemark_data_dir = "/home/struan/Vault/University/Doctorate/Data/GAN Partitioned Half new/Shoemarks"
shoeprint_data_dir = "/home/struan/Vault/University/Doctorate/Data/GAN Partitioned Half new/Shoeprints"
norm_mean = 0.9050
norm_std = 0.2318

