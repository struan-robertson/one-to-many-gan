# Config for training and running the model

[training]
batch_size = 4
random_seed = 421
batch_agnostic_steps = 200_000 # 50,000 steps at batch 4, matching the ablation families
image_buffer_size = 100
style_mixing_prob = 0.9 # Probability to use two different style vectors in the decoder
random_image_flip = true
deterministic_cuda_kernels = false # Exact results between different GPUs, but 4x slower
gpu_number = 0
checkpoint_directory = "checkpoints"
training_run = "santa_kl_1"

[inference]
checkpoint = "/home/struan/Development/Doctorate/one_to_many_gan/implementation/checkpoints/new_data_partition_fid_1/models/20000.tar"
batch_size = 32

[optimisation]
style_cycle_loss_lambda = 5.0
identity_loss_lambda = 5.0
reconstruction_loss_lambda = 5.0
kl_loss_lambda = 0.01
true_kl_loss = true # Substitution study: use the SANTA (Xie et al.) KL formulation — mean squared latents, requires add_latent_noise = true — instead of moment matching
path_loss_lambda = 0.1
path_loss_jacobian_granularity = [0.1, 0.2] # Min and max for sampling h to approximite Jacobian for path length
learning_rate = 2e-3
mapping_network_learning_rate = 2e-5 # 100x less
adam_betas = [0.5, 0.99]

[evaluation]
log_interval = 500
checkpoint_interval = 5_000 # Steps between checkpoints (and seeded validations), matching the ablation families
validate_during_training = false # OOMed twice mid-run on the pod; the seeded test_kid_fid.py sweep after training is identical
cond_is_n_evaluation_images = 100 # Number of images generated for conditional inception score
n_evaluation_images = 10_000
use_training_data = true # Seems counter-intuitive but recommended by the literature; with the seeded in-training validation this makes the training log the selection sweep (train-vs-train protocol)

[architecture]
s_dim = 6 # Dimensionality of the style vector
add_latent_noise = true # Add noise to latent feature maps
min_latent_resolution = 64
n_resnet_blocks = 7
mapping_network_layers = 2

[data]
image_size = [512, 256]
image_channels = 1
shoemark_data_dir = "/home/struan/Vault/University/Doctorate/Data/GAN/Partitioned New/Compiled/Shoemarks"
shoeprint_data_dir = "/home/struan/Vault/University/Doctorate/Data/GAN/Partitioned New/Compiled/Shoeprints"
shoemark_norm = [0.5, 0.5] 
shoeprint_norm = [0.5, 0.5] 

